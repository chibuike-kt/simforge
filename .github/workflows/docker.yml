name: Docker Build

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build control-plane
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/control-plane/Dockerfile
          target: production
          push: false
          tags: simforge/control-plane:${{ github.sha }}

      - name: Build execution-plane
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/execution-plane/Dockerfile
          target: production
          push: false
          tags: simforge/execution-plane:${{ github.sha }}
