global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'simforge-apps'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'control-plane'
    static_configs:
      - targets: ['control-plane:4000']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
